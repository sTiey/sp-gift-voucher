<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตรวจโหมดเต็มจออัตโนมัติ</title>
<!--
  ตรวจว่า "โหมดเต็มจอ" ทำงานถูกจริง โดยย่อ-ขยาย iframe แทนการหมุนเครื่องจริง
  สิ่งที่ต้องถูก:
    · จอแนวตั้ง → ใบแนวยาวหมุน 90° และ **ยาวเต็มความสูงจอพอดี**
    · จอแนวนอน → ใบแนวยาว **ไม่หมุน** และกว้างเต็มจอ (ผู้ใช้เอียงจอเองทีหลัง)
    · ใบกระทัดรัดไม่หมุนทั้งสองแบบ
    · แกนการเอียงต้องหมุนตามใบ ไม่งั้นเอียงซ้ายแล้วประกายวิ่งขึ้น-ลง
    · ปิดแล้วหน้าเดิมต้องกลับมาครบ
-->
<style>
  body { margin: 0; font: 13px/1.6 ui-monospace, monospace; background: #eee; }
  #log { padding: 12px 16px; background: #fff; white-space: pre-wrap; }
  iframe { width: 390px; height: 780px; border: 2px solid #999; }
</style>
</head>
<body>
<div id="log">กำลังตรวจ…</div>
<iframe id="f" src="mobile-test.html?jump=ticket"></iframe>

<script type="module">
const f = document.getElementById('f');
const results = [];
const check = (n, pass, detail = '') => results.push({ name: n, pass: Boolean(pass), detail: String(detail) });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const q = (s) => f.contentDocument.querySelector(s);
const box = (s) => { const e = q(s); if (!e) return null; const r = e.getBoundingClientRect(); return { w: Math.round(r.width), h: Math.round(r.height), l: Math.round(r.left), t: Math.round(r.top) }; };

async function size(w, h) { f.style.width = w + 'px'; f.style.height = h + 'px'; await wait(450); }

function tilt(w, beta, gamma) {
  w.dispatchEvent(new w.DeviceOrientationEvent('deviceorientation', { alpha: 0, beta, gamma }));
}

(async function run() {
  await new Promise((r) => (f.contentWindow.document.readyState === 'complete' ? r() : (f.onload = r)));
  await wait(500);
  const w = f.contentWindow;

  check('มีปุ่มดูเต็มจอบนขั้นดูบัตร', q('#full'), q('#full')?.textContent || 'ไม่เจอ');
  q('#full').click();
  await wait(500);

  const vp = () => ({ w: w.innerWidth, h: w.innerHeight });
  check('เปิดเต็มจอแล้ว', q('.vk-fs'), q('.vk-fs') ? 'มี .vk-fs' : 'ไม่เจอ');
  check('ซ่อนหน้าเดิมไว้ตอนเต็มจอ',
        w.getComputedStyle(q('.screen')).display === 'none', 'display=' + w.getComputedStyle(q('.screen')).display);

  let b = box('.vk-fs__rot');
  check('จอแนวตั้ง · ใบแนวยาวหมุนให้เอง', q('.vk-fs').dataset.rotated === 'true', 'rotated=' + q('.vk-fs').dataset.rotated);
  check('จอแนวตั้ง · ใบยาวเต็มความสูงจอพอดี', b.h === vp().h, `${b.h} / ${vp().h}`);
  check('จอแนวตั้ง · ใบอยู่กลางจอ', Math.abs(b.l + b.w / 2 - vp().w / 2) <= 1, `กลางใบที่ ${b.l + b.w / 2} · กลางจอ ${vp().w / 2}`);
  check('จอแนวตั้ง · ไม่ล้นจอ', f.contentDocument.documentElement.scrollWidth <= vp().w, '');

  /* แกนการเอียง — ใบหมุน 90° แล้ว เอียงซ้าย-ขวาต้องขยับแกนนอนของ "ใบ" ไม่ใช่แกนตั้ง */
  const card = q('.vk-fs .vk-card');
  for (let i = 0; i < 10; i++) { tilt(w, 45, 0); await wait(20); }
  await wait(600);
  tilt(w, 45, -24); await wait(650);
  const exA = card.style.getPropertyValue('--ft-ex'), eyA = card.style.getPropertyValue('--ft-ey');
  tilt(w, 45, 24); await wait(650);
  const exB = card.style.getPropertyValue('--ft-ex'), eyB = card.style.getPropertyValue('--ft-ey');
  const dEx = Math.abs(parseFloat(exA) - parseFloat(exB));
  const dEy = Math.abs(parseFloat(eyA) - parseFloat(eyB));
  check('ใบหมุนแล้วแกนการเอียงหมุนตาม', dEy > dEx * 2,
        `เอียงซ้าย-ขวา → แกนนอนขยับ ${dEx.toFixed(1)} · แกนตั้งขยับ ${dEy.toFixed(1)} (แกนตั้งต้องมากกว่า)`);

  /* ผู้ใช้เอียงจอเองทีหลัง → ใบต้องคืนเป็นแนวปกติ */
  await size(780, 390);
  b = box('.vk-fs__rot');
  check('พอผู้ใช้เอียงจอเอง · ใบเลิกหมุน', q('.vk-fs').dataset.rotated === 'false', 'rotated=' + q('.vk-fs').dataset.rotated);
  check('จอแนวนอน · ใบกว้างเต็มจอพอดี', b.w === vp().w, `${b.w} / ${vp().w}`);

  /* ปิดแล้วต้องคืนหน้าเดิม */
  await size(390, 780);
  q('.vk-fs__close').click();
  await wait(300);
  check('ปิดแล้วโหมดเต็มจอหายไป', !q('.vk-fs'), '');
  check('ปิดแล้วหน้าเดิมกลับมา', w.getComputedStyle(q('.screen')).display !== 'none' && q('#next'), '');

  /* ใบกระทัดรัดต้องไม่หมุน */
  f.src = 'mobile-test.html?jump=full-compact';
  await new Promise((r) => (f.onload = r));
  await wait(600);
  check('ใบกระทัดรัดไม่หมุน', q('.vk-fs')?.dataset.rotated === 'false', 'rotated=' + q('.vk-fs')?.dataset.rotated);
  const c = box('.vk-fs__rot');
  check('ใบกระทัดรัดกว้างเต็มจอ', c.w === f.contentWindow.innerWidth, `${c.w} / ${f.contentWindow.innerWidth}`);

  const pass = results.filter((r) => r.pass).length;
  document.getElementById('log').textContent =
    results.map((r) => `${r.pass ? 'OK  ' : 'FAIL'}  ${r.name}  —  ${r.detail}`).join('\n') +
    `\n\nผ่าน ${pass} / ${results.length}`;
  console.log('FSCHECK ' + JSON.stringify({ pass, fail: results.length - pass, results }));
})();
</script>
</body>
</html>
