<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตรวจว่าห้องแล็บไจโรเองไม่พัง</title>
<!--
  เดินห้องแล็บให้ครบทุกข้อแทนคน ด้วยสัญญาณเซนเซอร์ปลอม
  จุดประสงค์: ยืนยันว่า **ตัวแบบทดสอบเอง** ไม่ค้าง ไม่ข้ามข้อ และตัดสินผลถูก
  ก่อนส่งให้ไท้ไปเทสจริง — ไม่งั้นไท้เสียเวลาฟรีถ้าแล็บพังเอง

  โครง: เดินตาม data-step บน <body> ของแล็บ · แต่ละข้อ **ตั้งท่าก่อนแล้วค่อยกดปุ่ม**
  เหมือนคนจริงทำ (แล็บถามว่าพร้อมยังก่อนเริ่มจับทุกข้อ)
-->
<style>
  body { margin: 0; font: 13px/1.6 ui-monospace, monospace; background: #eee; }
  #log { padding: 12px 16px; background: #fff; white-space: pre-wrap; }
  iframe { width: 420px; height: 860px; border: 2px solid #999; }
</style>
</head>
<body>
<div id="log">กำลังตรวจ…</div>
<iframe id="f" src="gyro-lab.html"></iframe>

<script type="module">
const f = document.getElementById('f');
const R = [];
const check = (n, pass, d = '') => R.push({ name: n, pass: Boolean(pass), detail: String(d) });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const doc = () => f.contentDocument;
const win = () => f.contentWindow;

const emit = (extra = {}) => {
  const ok = R.filter((r) => r.pass).length;
  const pl = JSON.stringify({ pass: ok, fail: R.length - ok, results: R, sample: '', ...extra });
  console.log('LAB64 ' + btoa(String.fromCharCode(...new TextEncoder().encode(pl))));
};
/* ตัวขับพังเองต้องบอกมาว่าพังตรงไหน ไม่ใช่เงียบแล้วปล่อยให้เดา */
window.addEventListener('error', (e) => emit({ crash: `${e.message} @ ${e.lineno}` }));
window.addEventListener('unhandledrejection', (e) => emit({ crash: 'reject: ' + (e.reason?.message || e.reason) }));
setTimeout(() => { if (!window.__done) emit({ crash: 'หมดเวลา — แล็บค้าง', stalled: true }); }, 170000);

/* ── ปั๊มสัญญาณเซนเซอร์ปลอม สั่งเป็น "แกนของจอ" ─────────────────────────
   ⚠️ พอจอหมุนไปแนวนอน คำว่า "เอียงซ้าย-ขวาที่ตาเห็น" เปลี่ยนไปใช้ beta แทน gamma
      ถ้าไดรฟ์ด้วย gamma ต่อไปเรื่อย ๆ แล็บจะไม่เห็นการเอียงเลยแล้วค้าง */
let sent = 0;
let screenDeg = 0;
const REST = { sx: 0, sy: 45 };
let want = { ...REST };
let pumping = true;

function fire(beta, gamma) {
  const W = win();
  if (!W || !W.DeviceOrientationEvent) return;
  const ev = new W.DeviceOrientationEvent('deviceorientation', { alpha: 0, beta, gamma });
  /* บางเบราว์เซอร์สร้าง event แล้ว beta/gamma กลายเป็น null ทั้งที่ใส่ค่าไป */
  if (ev.beta !== beta) Object.defineProperty(ev, 'beta', { value: beta, configurable: true });
  if (ev.gamma !== gamma) Object.defineProperty(ev, 'gamma', { value: gamma, configurable: true });
  W.dispatchEvent(ev);
  sent += 1;
}
const toDevice = (sx, sy) => {
  const th = (screenDeg * Math.PI) / 180;
  const c = Math.cos(th), s = Math.sin(th);
  return { g: sx * c - sy * s, b: sx * s + sy * c };
};
(async function pump() {
  while (pumping) { const d = toDevice(want.sx, want.sy); fire(d.b, d.g); await wait(30); }
})();

async function moveTo(sx, sy, ms = 700) {
  const from = { ...want };
  const n = Math.max(1, Math.round(ms / 30));
  for (let i = 1; i <= n; i++) {
    want = { sx: from.sx + (sx - from.sx) * i / n, sy: from.sy + (sy - from.sy) * i / n };
    await wait(30);
  }
}

/** ปลอมมุมจอ แล้วอ่านกลับมาตรวจว่าติดจริง + ยิง orientationchange เหมือนเครื่องจริง */
function fakeScreen(deg) {
  const W = win();
  try { Object.defineProperty(W.screen.orientation, 'angle', { value: deg, configurable: true }); } catch { /* ต่อไป */ }
  if (W.screen.orientation?.angle !== deg) {
    try { Object.defineProperty(Object.getPrototypeOf(W.screen.orientation), 'angle', { get: () => deg, configurable: true }); } catch { /* ต่อไป */ }
  }
  try { Object.defineProperty(W, 'orientation', { value: deg, configurable: true }); } catch { /* ต่อไป */ }
  W.dispatchEvent(new W.Event('orientationchange'));
  const got = W.screen.orientation?.angle;
  if (got === deg) screenDeg = deg;
  return got;
}

const step = () => doc()?.body?.dataset?.step;
const btn = (re) => [...(doc()?.querySelectorAll('#btns button') || [])].find((b) => re.test(b.textContent));
const READY = /พร้อมแล้ว|เริ่มตรวจ|แนวตั้งแล้ว|วางแล้ว|ถืออยู่แล้ว|กลับมาแล้ว/;

async function waitStepChange(from, ms = 45000) {
  const t = Date.now();
  while (Date.now() - t < ms) {
    if (step() !== from) return step();
    await wait(120);
  }
  return null;
}
async function waitButton(re, ms = 20000) {
  const t = Date.now();
  while (Date.now() - t < ms) {
    const b = btn(re);
    if (b) return b;
    await wait(120);
  }
  return null;
}

/* ท่าที่ต้องทำในแต่ละข้อ — ตั้งท่า "ก่อน" กดปุ่มเมื่อข้อนั้นสั่งแบบนั้น */
const ACTS = {
  '2': { after: async () => { await moveTo(6, REST.sy, 400); await moveTo(0, REST.sy, 400); } },
  '3': { after: async () => wait(6500) },
  '4': { after: async () => moveTo(-26, REST.sy, 1100) },
  '5': { after: async () => moveTo(26, REST.sy, 1300) },
  '6': { after: async () => { await moveTo(0, REST.sy - 26, 1200); await wait(400); await moveTo(0, REST.sy + 26, 1300); } },
  '7': { after: async () => { await moveTo(0, REST.sy, 400); fakeScreen(90); await wait(900); } },
  '8': { after: async () => { await moveTo(0, REST.sy, 900); await moveTo(-28, REST.sy, 1200); } },
  '9': { before: async () => { fakeScreen(0); await moveTo(0, REST.sy, 600); },
         after: async () => { await wait(1900); await moveTo(28, REST.sy, 1400); } },
  '10': { before: async () => moveTo(0, 0, 900),          /* วางราบก่อนค่อยกด */
          after: async () => wait(13000) },
  '11': { before: async () => moveTo(0, 48, 1100),        /* ยกขึ้นถือก่อนค่อยกด */
          after: async () => wait(13000) },
  '12': { before: async () => {
            /* ⚠️ ห้ามเขียน new win().Event(...) — JS อ่านว่า (new win()).Event(...)
               คือพยายามสร้าง object จากฟังก์ชัน win แล้วพังว่า "win is not a constructor"
               ต้องดึง window ออกมาเก็บก่อนเสมอ · บั๊กนี้ซ่อนอยู่ใน try/catch มาหลายรอบ
               จึงเป็นสาเหตุที่ข้อ "สลับแอป" ไม่เคยผ่านเลยตั้งแต่ต้น */
            const W = win();
            const D = W.document;
            const setHidden = (v) => {
              for (const t of [D, Object.getPrototypeOf(D), W.Document?.prototype]) {
                if (!t) continue;
                try { Object.defineProperty(t, 'hidden', { get: () => v, configurable: true }); if (D.hidden === v) return true; } catch { /* ต่อไป */ }
              }
              return false;
            };
            setHidden(true);
            D.dispatchEvent(new W.Event('visibilitychange'));
            await wait(400);
            setHidden(false);
            D.dispatchEvent(new W.Event('visibilitychange'));
          },
          after: async () => wait(2200) },
  /* ข้อที่คนต้องตอบ — ปุ่มไม่ได้ชื่อ "พร้อมแล้ว" จึงต้องบอกให้กดปุ่มแรกแทน */
  '13': { pick: true },
  '14': { pick: true },
};

(async function run() {
 try {
  await new Promise((r) => (win().document.readyState === 'complete' ? r() : (f.onload = r)));
  await wait(600);

  check('หน้าแล็บเปิดได้ · ขึ้นข้อแรก', step() === '0', 'data-step=' + step());
  check('บัตรอยู่ในจอตั้งแต่ต้น', doc().querySelector('#card .vk-card'), '');

  let guard = 0;
  let stuck = null;
  while (step() !== 'done' && guard++ < 40) {
    const now = step();
    const act = ACTS[now] || {};
    if (act.before) await act.before();
    const b = act.pick
      ? await waitButton(/./, 8000)
      : await waitButton(READY, now === '1' ? 3000 : 20000);
    if (b) {
      b.click();
      if (act.after) await act.after();
    }
    const next = await waitStepChange(now);
    if (next === null) { stuck = now; break; }
  }
  check('ไม่มีข้อไหนค้าง', stuck === null, stuck ? `ค้างที่ข้อ ${stuck}` : '');
  check('เดินครบทุกข้อจนจบ', step() === 'done', 'จบที่ data-step=' + step());

  const lab = win().GYRO_LAB;
  check('แล็บออกรายงานให้', lab && lab.text && lab.text.length > 400, lab ? lab.text.length + ' ตัวอักษร' : 'ไม่มี');
  const txt = lab ? lab.text : '';
  for (const [n, re] of [
    ['รายงานบอกเครื่อง', /เครื่อง \S+/],
    ['รายงานมีผลรายข้อ', /--- ผลรายข้อ ---/],
    ['รายงานมีจังหวะสัญญาณ', /จังหวะสัญญาณ กลาง [\d.]+ ms/],
    ['รายงานมีช่วงค่าที่เจอ', /ช่วงค่าที่เจอ β/],
    ['รายงานมีความละเอียดค่า', /ความละเอียดค่าที่เล็กที่สุด \S+/],
    ['รายงานนับสัญญาณได้', /ทั้งหมด [1-9]\d* ครั้ง/],
    ['รายงานบอกมุมจอที่ผ่านมา', /มุมจอที่ผ่านมา .*90/],
  ]) check(n, re.test(txt), (txt.match(re) || ['ไม่เจอ'])[0]);

  /* ⚠️ อ่านคำตัดสินจากข้อมูลของแล็บโดยตรง ห้ามหาคำว่า "ผ่าน" ในข้อความ
     เพราะคำว่า "ไม่ผ่าน" มีคำว่า "ผ่าน" อยู่ข้างใน → ข้อที่ตกจะถูกนับว่าผ่านหมด */
  const byName = (s) => (lab?.results || []).find((r) => r.name.includes(s));
  for (const [label, key] of [
    ['ข้อทิศประกายแนวนอนผ่าน', 'เอียงขวา'],
    ['ข้อทิศประกายแนวตั้งผ่าน', 'เงย-ก้ม'],
    ['ข้อแกนสลับตอนจอแนวนอนผ่าน', 'แนวนอน · แกนสลับ'],
    ['ข้อแกนหมุนตามบัตรในโหมดเต็มจอผ่าน', 'เต็มจอ'],
    ['ข้อวางราบแล้วคลายกลับเข้ากลางผ่าน', 'วางราบ'],
    ['ข้อยกขึ้นถือใหม่แล้วไม่ค้างผ่าน', 'ยกขึ้นถือใหม่'],
  ]) {
    const r = byName(key);
    check(label, r?.verdict === 'ผ่าน', r ? `${r.verdict} · ${r.detail}`.slice(0, 95) : 'ไม่เจอข้อนี้');
  }
  check('ไม่มีข้อไหนค้างไม่ตัดสิน', (lab?.results || []).length >= 13 && lab.results.every((r) => r.verdict),
        `${lab?.results?.length || 0} ข้อ`);

  pumping = false;
  const ok = R.filter((r) => r.pass).length;
  document.getElementById('log').textContent =
    R.map((r) => `${r.pass ? 'OK  ' : 'FAIL'}  ${r.name}  —  ${r.detail}`).join('\n') +
    `\n\nผ่าน ${ok} / ${R.length}\n\n----- รายงานที่แล็บออกให้ -----\n` + txt;
  window.__done = true;
  const payload = JSON.stringify({ pass: ok, fail: R.length - ok, results: R, sample: txt });
  console.log('LAB64 ' + btoa(String.fromCharCode(...new TextEncoder().encode(payload))));
 } catch (err) { emit({ crash: (err && err.message) || String(err) }); }
})();
</script>
</body>
</html>
