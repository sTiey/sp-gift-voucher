<!doctype html>
<html lang="th" data-vk-skin="steel" data-vk-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ออกคูปอง</title>
<link rel="stylesheet" href="../src/styles/fonts.css">
<link rel="stylesheet" href="../src/tokens/tokens.css">
<link rel="stylesheet" href="../src/tokens/skin-steel.css">
<link rel="stylesheet" href="../src/tokens/skin-ink.css">
<link rel="stylesheet" href="../src/tokens/skin-voltage.css">
<link rel="stylesheet" href="../src/styles/base.css">
<link rel="stylesheet" href="../src/styles/voucher.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">
  <div class="app__bar app__bar--wide">
    <div class="app__bar-inner">
      <a class="app__back" href="index.html" aria-label="ย้อนกลับ">←</a>
      <div>
        <div class="app__title" id="ttl"></div>
        <div class="app__sub">ตัวอย่างหน้าหลังบ้าน · ปรับแล้วเห็นใบเปลี่ยนทันที</div>
      </div>
      <div class="vk-spacer"></div>
      <div id="themeSlot"></div>
    </div>
  </div>

  <div class="app__wrap app__wrap--wide">
    <div class="split">

      <!-- ฟอร์ม -->
      <form class="panel" id="form" autocomplete="off">
        <div class="rows">
          <div class="field">
            <label class="field__label" for="title">ชื่อที่จะพิมพ์บนใบ</label>
            <input class="input" id="title" value="ส่วนลดพาร์ทเนอร์ ไตรมาส 4">
          </div>

          <div class="grid2">
            <div class="field">
              <label class="field__label" for="kind">ชนิดสิทธิ์</label>
              <select class="input" id="kind"></select>
            </div>
            <div class="field">
              <label class="field__label" for="value">มูลค่า</label>
              <input class="input" id="value" type="number" value="15" min="0">
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label class="field__label" for="minSpend">ยอดขั้นต่ำ (บาท)</label>
              <input class="input" id="minSpend" type="number" value="10000" min="0">
            </div>
            <div class="field">
              <label class="field__label" for="maxDiscount">ลดสูงสุด (บาท)</label>
              <input class="input" id="maxDiscount" type="number" value="2000" min="0">
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label class="field__label" for="segment">กลุ่มเป้าหมาย</label>
              <select class="input" id="segment"></select>
            </div>
            <div class="field">
              <label class="field__label" for="badge">ป้ายมุมใบ</label>
              <input class="input" id="badge" value="PARTNER" maxlength="14">
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label class="field__label" for="until">ใช้ได้ถึง</label>
              <input class="input" id="until" type="date" value="2026-12-31">
            </div>
            <div class="field">
              <label class="field__label" for="skin">ธีมของใบ</label>
              <select class="input" id="skin"></select>
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label class="field__label" for="prefix">อักษรนำหน้ารหัส</label>
              <input class="input" id="prefix" value="SPE" maxlength="4">
            </div>
            <div class="field">
              <label class="field__label" for="count">จำนวนใบ</label>
              <input class="input" id="count" type="number" value="20" min="1" max="2000">
            </div>
          </div>

          <button class="btn btn--primary" id="makeBtn" type="button"></button>
          <span class="field__hint" id="hint"></span>
        </div>
      </form>

      <!-- ตัวอย่างสด -->
      <div>
        <span class="vk-label" style="display:block;margin-block-end:var(--vk-space-3)">ตัวอย่าง</span>
        <div id="preview"></div>
        <div id="result" style="margin-block-start:var(--vk-space-5)"></div>
      </div>

    </div>
  </div>
</div>

<script type="module">
import { getService, mountThemeToggle, toast, copyText } from './app.js';
import {
  createVoucher, voucherCardHtml, generateCode, KINDS, SEGMENTS, SKINS, t,
} from '../src/index.js';

const $ = (s) => document.querySelector(s);
mountThemeToggle($('#themeSlot'));
$('#ttl').textContent = t('admin.title');
$('#makeBtn').textContent = t('admin.generate');

/* เติมตัวเลือกจากรายการกลางใน schema — เพิ่มชนิดใหม่ที่ schema แล้วที่นี่ขึ้นเอง */
$('#kind').innerHTML = KINDS.map((k) => `<option value="${k}">${t(`kind.${k}`)} (${k})</option>`).join('');
$('#segment').innerHTML = SEGMENTS.map((s) => `<option value="${s}"${s === 'partner' ? ' selected' : ''}>${t(`segment.${s}`)}</option>`).join('');
$('#skin').innerHTML = SKINS.map((s) => `<option value="${s}">${s}</option>`).join('');

const svc = await getService();
let sampleCode = generateCode({ prefix: 'SPE' });

/** อ่านค่าจากฟอร์มเป็นแม่พิมพ์คูปอง 1 ใบ */
function readForm() {
  const kind = $('#kind').value;
  const until = $('#until').value;
  return {
    kind,
    value: Number($('#value').value || 0),
    title: $('#title').value,
    brand: { name: 'SP Empire' },
    conditions: {
      minSpend: Number($('#minSpend').value) || null,
      maxDiscount: kind === 'percent' ? (Number($('#maxDiscount').value) || null) : null,
      combinable: false,
    },
    audience: { segments: [$('#segment').value] },
    validUntil: until ? new Date(`${until}T23:59:59+07:00`).toISOString() : null,
    limits: { perPerson: 1, total: null },
    design: { skin: $('#skin').value, layout: 'slab', badge: $('#badge').value || null },
  };
}

function paint() {
  const tpl = readForm();
  document.documentElement.setAttribute('data-vk-skin', tpl.design.skin);
  $('#preview').innerHTML = voucherCardHtml(
    createVoucher({ ...tpl, code: sampleCode }),
    { layout: 'slab' }
  );
  const n = Number($('#count').value || 1);
  $('#hint').textContent = `จะสร้าง ${n} ใบ · รหัสไม่ซ้ำกัน · ใบตัวอย่างนี้ยังไม่ถูกบันทึก`;
}

$('#form').addEventListener('input', paint);
$('#form').addEventListener('change', paint);

$('#makeBtn').addEventListener('click', async () => {
  const tpl = readForm();
  const count = Math.min(2000, Math.max(1, Number($('#count').value || 1)));
  try {
    const made = await svc.issue(tpl, { count, prefix: $('#prefix').value });
    sampleCode = made[0].code;
    paint();
    $('#result').innerHTML = `
      <div class="verdict" data-tone="ok">
        <div class="verdict__head">${t('admin.generatedPrefix')} ${made.length} ใบ</div>
        <div class="verdict__body">เก็บไว้ในเบราว์เซอร์แล้ว ลองเอารหัสไปตรวจที่หน้าร้านได้เลย</div>
      </div>
      <div class="codes" style="margin-block-start:var(--vk-space-3)">
        ${made.map((v) => `<span>${v.code}</span>`).join('')}
      </div>
      <div style="display:flex;gap:var(--vk-space-2);margin-block-start:var(--vk-space-3)">
        <button class="btn btn--ghost" id="copyAll" type="button">${t('common.copy')}รหัสทั้งหมด</button>
        <button class="btn btn--ghost" id="dl" type="button">${t('admin.exportJson')}</button>
      </div>`;

    $('#copyAll').addEventListener('click', async () => {
      await copyText(made.map((v) => v.code).join('\n'));
      toast(t('common.copied'));
    });
    $('#dl').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(made, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `vouchers-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  } catch (err) {
    $('#result').innerHTML = `<div class="verdict" data-tone="bad">
        <div class="verdict__head">สร้างไม่ได้</div>
        <div class="verdict__body">${err.message}</div>
      </div>`;
  }
});

paint();
</script>
</body>
</html>
