<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตั๋วฟอยล์ทอง</title>
<link rel="stylesheet" href="../src/styles/fonts.css">
<link rel="stylesheet" href="../src/tokens/tokens.css">
<link rel="stylesheet" href="../src/tokens/skin-steel.css">
<link rel="stylesheet" href="../src/styles/base.css">
<link rel="stylesheet" href="../src/styles/card-base.css">
<link rel="stylesheet" href="../src/styles/designs/foilticket.css">
<style>
  body { margin: 0; background: #cfcabf; color: #221c12;
         font-family: 'Google Sans', 'Noto Sans Thai', sans-serif; }

  .hd { position: sticky; top: 0; z-index: 40;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding: 12px 24px; background: rgb(26 20 12 / 96%);
        backdrop-filter: blur(10px); color: #f4efe4; }
  .hd__t { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .hd__s { font-size: 12px; color: #b6ac99; }
  .sp { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: #3a3226; border-radius: 6px; }
  .seg button { padding: 5px 11px; border-radius: 4px; border: 0; cursor: pointer;
                font: inherit; font-size: 12px; font-weight: 500; color: #b6ac99; background: none; }
  .seg button[aria-pressed='true'] { background: #f4efe4; color: #221c12; font-weight: 600; }

  .wrap { max-width: 880px; margin-inline: auto; padding: 34px 24px 90px; display: grid; gap: 40px; }
  .row { display: grid; gap: 11px; }
  .row__hd { display: flex; align-items: baseline; gap: 10px; }
  .row__k { font: 700 11px/1 'IBM Plex Mono', monospace; letter-spacing: .12em;
            background: #221c12; color: #f4efe4; padding: 5px 8px; }
  .row__name { font-size: 16px; font-weight: 700; }
  .row__note { font-size: 12.5px; color: #6c6152; }
  .stage { background: #b4ada0; padding: 26px; }

  /* แผงบอกสถานะ — วางติดการ์ดเลย ไม่ใช่ซ่อนอยู่บนหัวหน้าที่เลื่อนผ่านได้
     ถ้าเอฟเฟกต์ไม่ทำงาน ต้องรู้สาเหตุจากตรงนี้ทันทีโดยไม่ต้องเปิดคอนโซล */
  .diag {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 10px; padding: 10px 14px; background: #fff;
    border-left: 4px solid #b58f3c;
    font: 500 12.5px/1.5 'IBM Plex Mono', 'Noto Sans Thai', monospace;
    color: #4a4235;
  }
  .diag[data-bad='true'] { border-left-color: #c4432c; background: #fff4f1; }
  .diag b { font-weight: 700; }
  .diag button {
    padding: 5px 12px; border: 0; border-radius: 4px; cursor: pointer;
    font: inherit; font-weight: 700; background: #221c12; color: #f4efe4;
  }
</style>
</head>
<body>

<div class="hd">
  <span class="hd__t">ตั๋วฟอยล์ทอง</span>
  <span class="hd__s" id="status">กำลังเริ่ม…</span>
  <span class="sp"></span>
  <span class="hd__s">ตัวอย่าง</span>
  <div class="seg" id="seg">
    <button type="button" data-v="percent" aria-pressed="true">ลด %</button>
    <button type="button" data-v="amount" aria-pressed="false">บัตรกำนัล</button>
    <button type="button" data-v="fixed" aria-pressed="false">ราคาพิเศษ</button>
    <button type="button" data-v="ship" aria-pressed="false">ส่งฟรี</button>
    <button type="button" data-v="used" aria-pressed="false">ใช้แล้ว</button>
  </div>
</div>

<div class="wrap" id="wrap"></div>
<div class="wrap" style="padding-top:0"><div class="diag" id="diag">กำลังตรวจ…</div></div>

<script type="module">
import { cardHtml } from '../src/ui/voucher-design.js';
import { createVoucher } from '../src/index.js';
import { attachFoilTilt, requestGyro } from '../src/ui/foil-tilt.js';

/* ?spot=x,y ตรึงตำแหน่งดวงแสงไว้ที่จุดเดียว — ใช้ตอนแคปหน้าจอเทียบว่าดวงแสงขยับจริง
   ปกติ (ไม่ใส่) ดวงแสงจะวิ่งตามเมาส์/การเอียงเครื่อง */
const FIXED = new URLSearchParams(location.search).get('spot');
const say = (t) => { document.querySelector('#status').textContent = t; };

const SAMPLES = {
  percent: { code: 'SPE-7K4M-92XH', kind: 'percent', value: 15,
    title: 'ส่วนลดพาร์ทเนอร์ ไตรมาส 3', note: 'ขอบคุณที่ร่วมงานกับเรามาตลอด 3 ปี',
    conditions: { minSpend: 10000, maxDiscount: 2000 }, audience: { segments: ['partner'] },
    validUntil: '2026-12-31T23:59:59+07:00', design: { badge: 'PARTNER' } },
  amount: { code: 'VIP-3H8N-5TQA', kind: 'amount', value: 1500,
    title: 'บัตรกำนัลลูกค้าประจำ', conditions: { minSpend: 8000 },
    audience: { segments: ['vip'] }, validUntil: '2026-09-30T23:59:59+07:00' },
  fixed: { code: 'BACK-9RD2-6MWB', kind: 'fixed_price', value: 7900,
    title: 'ราคาพิเศษ · ราวระเบียง 1 ชุด', audience: { segments: ['returning'] },
    validUntil: '2026-10-31T23:59:59+07:00', design: { badge: '30 สิทธิ์' } },
  ship: { code: 'SHIP-4C7B-8XJR', kind: 'free_shipping', value: 0,
    title: 'ส่งฟรีทั่วประเทศ', conditions: { minSpend: 5000 }, validUntil: null },
  used: { code: 'SPE-6J2X-4NBY', kind: 'amount', value: 500,
    title: 'ส่วนลดต้อนรับลูกค้าใหม่', conditions: { minSpend: 3000 },
    state: 'redeemed', validUntil: '2026-12-31T23:59:59+07:00' },
};

/* ตัวเลขมูลค่าจะใช้ฟอนต์ไหนยังไม่เคาะ — วางเทียบให้เห็นสองทางไปเลย
   ซานเซอริฟ = ฟอนต์ที่ไท้ล็อกไว้เดิม · มีเชิง = ใกล้ภาพอ้างอิงมากกว่า */
const ROWS = [
  { k: 'ก', face: '', name: 'ตัวเลขแบบซานเซอริฟ',
    note: 'Google Sans — ฟอนต์ที่ไท้ล็อกไว้ตั้งแต่แรก' },
  { k: 'ข', face: 'serif', name: 'ตัวเลขแบบมีเชิง',
    note: 'Playfair Display — หนา-บางตัดกันแรง ใกล้ภาพอ้างอิง และเข้าชุดกับโลโก้ SP EMPIRE ที่เป็นเชิงอยู่แล้ว' },
];

let sample = 'percent';

function paint() {
  const v = createVoucher(SAMPLES[sample]);
  document.querySelector('#wrap').innerHTML = ROWS.map((r) => `
    <section class="row">
      <div class="row__hd">
        <span class="row__k">${r.k}</span>
        <span class="row__name">${r.name}</span>
        <span class="row__note">${r.note}</span>
      </div>
      <div class="stage">
        ${cardHtml(v, { design: 'foilticket', shape: 'ticket' })
          .replace('<div class="vk-voucher"', `<div class="vk-voucher"${r.face ? ` data-numface="${r.face}"` : ''}`)}
      </div>
    </section>`).join('');

  const cards = [...document.querySelectorAll('.vk-card')];
  if (FIXED !== null) {
    const [x, y = x] = FIXED.split(',');
    for (const card of cards) {
      card.style.setProperty('--ft-spot-x', `${x}%`);
      card.style.setProperty('--ft-spot-y', `${y}%`);
    }
    document.querySelector('#diag').textContent =
      `ตรึงดวงแสงไว้ที่ ${x}%, ${y}% ตามลิงก์ — เอา ?spot ออกถ้าอยากให้วิ่งตามเมาส์`;
    return;
  }

  wire(cards, false);
}

/* บอกสถานะแบบเลี่ยงไม่ได้ — ถ้าเอฟเฟกต์ไม่ทำงาน ต้องรู้สาเหตุจากหน้าเว็บทันที
   ไม่ใช่ต้องอัดคลิปมาถามกัน · อ่านค่าจาก "ไล่เฉดที่วาดจริง" ไม่ใช่จากตัวแปรที่เราเซ็ตเอง */
function wire(cards, force) {
  const diag = document.querySelector('#diag');
  const box = (bad, html) => { diag.dataset.bad = String(bad); diag.innerHTML = html; };

  Promise.all(cards.map((c) => attachFoilTilt(c, { force }))).then((rs) => {
    const r = rs[0] || {};
    if (r.state === 'reduced-motion') {
      box(true, '<b>⚠️ เอฟเฟกต์ถูกปิดอยู่</b> เพราะเครื่องตั้งค่า "ลดแอนิเมชัน" ไว้ ' +
        '<span>(Windows → การช่วยการเข้าถึง → เอฟเฟกต์ภาพ → เอฟเฟกต์ภาพเคลื่อนไหว)</span> ' +
        '<button type="button" id="force">บังคับเปิดเพื่อดู</button>');
      diag.querySelector('#force').onclick = () => wire(cards, true);
      return;
    }
    if (r.state !== 'on') {
      box(true, `<b>⚠️ เปิดเอฟเฟกต์ไม่สำเร็จ</b> — ${r.state}${r.error ? ' · ' + r.error : ''}`);
      return;
    }

    const card = cards[0];
    const num = card.querySelector('.vk-card__num');
    const centre = () => {
      const m = getComputedStyle(num).backgroundImage.match(/at ([0-9.]+%) ([0-9.]+%)/);
      return m ? `${m[1]} ${m[2]}` : 'กึ่งกลาง';
    };
    /* บอกให้ชัดว่า "ยังไม่เอียง" ต่างจาก "อ่านค่าไม่ได้" — ตอนยังไม่ขยับ
       ตัวใบไม่มี transform เลย ถ้าโชว์ขีดเฉย ๆ จะแยกไม่ออกว่าพังหรือแค่ยังไม่ขยับ */
    const tilted = () => {
      const t = getComputedStyle(card).transform;
      if (t === 'none') return 'ยังไม่เอียง';
      const m = t.match(/matrix3d\(([-\d.]+),\s*([-\d.]+),\s*([-\d.]+)/);
      return m ? `เอียงอยู่ (${(+m[3]).toFixed(3)})` : 'เอียงอยู่';
    };
    box(false, `<b>พร้อมใช้${force ? ' (บังคับเปิด)' : ''}</b> — เอาเมาส์ไปวางบนใบ แล้วดูตัวเลขสองชุดนี้วิ่ง` +
      ' · <span id="live">ยังไม่ได้ขยับเมาส์</span>');
    card.addEventListener('pointermove', () => {
      diag.querySelector('#live').textContent =
        `ดวงแสง ${centre()} · การ์ดเอียง ${tilted() ?? '—'}`;
    }, { passive: true });
  });
}

/* iOS ขอสิทธิ์ไจโรได้เฉพาะตอนผู้ใช้แตะ — ผูกไว้กับการแตะครั้งแรกของหน้า */
addEventListener('pointerdown', function once() {
  removeEventListener('pointerdown', once);
  requestGyro();
}, { once: true });

document.querySelector('#seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  sample = b.dataset.v;
  for (const x of document.querySelectorAll('#seg button')) x.setAttribute('aria-pressed', String(x === b));
  paint();
});

paint();
</script>
</body>
</html>
