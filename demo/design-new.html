<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3 ทิศทางใหม่ — ตั๋วโมเดิร์นอาร์ต</title>
<link rel="stylesheet" href="../src/styles/fonts.css">
<link rel="stylesheet" href="../src/tokens/tokens.css">
<link rel="stylesheet" href="../src/tokens/skin-steel.css">
<link rel="stylesheet" href="../src/styles/base.css">
<link rel="stylesheet" href="../src/styles/card-base.css">
<link rel="stylesheet" href="../src/styles/designs/stubline.css">
<link rel="stylesheet" href="../src/styles/designs/arcdisc.css">
<link rel="stylesheet" href="../src/styles/designs/slantset.css">
<style>
  :root { --ink: #14161a; --ink-2: #55595f; }
  body { margin: 0; background: #d9dade; color: var(--ink);
         font-family: 'Google Sans', 'Noto Sans Thai', sans-serif; }

  .hd { position: sticky; top: 0; z-index: 40;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding: 12px 24px; background: rgb(18 20 24 / 96%);
        backdrop-filter: blur(10px); color: #f2f3f5; }
  .hd__t { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .hd__s { font-size: 12px; color: #a7abb3; }
  .sp { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: #2a2d33; border-radius: 6px; }
  .seg button { padding: 5px 11px; border-radius: 4px; border: 0; cursor: pointer;
                font: inherit; font-size: 12px; font-weight: 500; color: #a7abb3; background: none; }
  .seg button[aria-pressed='true'] { background: #f2f3f5; color: #14161a; font-weight: 600; }

  .wrap { max-width: 900px; margin-inline: auto; padding: 34px 24px 100px; display: grid; gap: 46px; }

  .dir { display: grid; gap: 13px; }
  .dir__hd { display: flex; align-items: baseline; gap: 11px; flex-wrap: wrap; }
  .dir__k { font: 700 11px/1 'IBM Plex Mono', monospace; letter-spacing: .14em;
            background: #14161a; color: #fff; padding: 5px 8px; }
  .dir__name { font-size: 20px; font-weight: 700; letter-spacing: -.015em; }
  .dir__blurb { font-size: 13px; color: var(--ink-2); }
  .dir__sig { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; max-width: 62ch; }
  .dir__sig b { color: var(--ink); font-weight: 600; }
  .stagebox { background: #b9bbc0; padding: 22px; }
</style>
</head>
<body>

<div class="hd">
  <span class="hd__t">3 ทิศทางใหม่</span>
  <span class="hd__s">ทรงยาวก่อน · เลือกได้ 1 แล้วค่อยลงรายละเอียด + ทำทรงกระทัดรัด</span>
  <span class="sp"></span>
  <span class="hd__s">ตัวอย่าง</span>
  <div class="seg" id="seg">
    <button type="button" data-v="percent" aria-pressed="true">ลด %</button>
    <button type="button" data-v="amount" aria-pressed="false">บัตรกำนัล</button>
    <button type="button" data-v="fixed" aria-pressed="false">ราคาพิเศษ</button>
    <button type="button" data-v="ship" aria-pressed="false">ส่งฟรี</button>
    <button type="button" data-v="used" aria-pressed="false">ใช้แล้ว</button>
  </div>
</div>

<div class="wrap" id="wrap"></div>

<script type="module">
import { cardHtml } from '../src/ui/voucher-design.js';
import { createVoucher } from '../src/index.js';

const SAMPLES = {
  percent: { code: 'SPE-7K4M-92XH', kind: 'percent', value: 15,
    title: 'ส่วนลดพาร์ทเนอร์ ไตรมาส 3', note: 'ขอบคุณที่ร่วมงานกับเรามาตลอด 3 ปี',
    conditions: { minSpend: 10000, maxDiscount: 2000 }, audience: { segments: ['partner'] },
    validUntil: '2026-12-31T23:59:59+07:00', design: { badge: 'PARTNER' } },
  amount: { code: 'VIP-3H8N-5TQA', kind: 'amount', value: 1500,
    title: 'บัตรกำนัลลูกค้าประจำ', conditions: { minSpend: 8000 },
    audience: { segments: ['vip'] }, validUntil: '2026-09-30T23:59:59+07:00' },
  fixed: { code: 'BACK-9RD2-6MWB', kind: 'fixed_price', value: 7900,
    title: 'ราคาพิเศษ · ราวระเบียง 1 ชุด', audience: { segments: ['returning'] },
    validUntil: '2026-10-31T23:59:59+07:00', design: { badge: '30 สิทธิ์' } },
  ship: { code: 'SHIP-4C7B-8XJR', kind: 'free_shipping', value: 0,
    title: 'ส่งฟรีทั่วประเทศ', conditions: { minSpend: 5000 }, validUntil: null },
  used: { code: 'SPE-6J2X-4NBY', kind: 'amount', value: 500,
    title: 'ส่วนลดต้อนรับลูกค้าใหม่', conditions: { minSpend: 3000 },
    state: 'redeemed', validUntil: '2026-12-31T23:59:59+07:00' },
};

const DIRS = [
  { key: 'ก', id: 'stubline', name: 'เส้นปรุ', art: 'stair',
    blurb: 'โครงตั๋วจริง · สะอาดแบบสวิส',
    sig: 'ลายเซ็น: <b>ตัวเลขคร่อมเส้นปรุ</b> ครึ่งซ้ายอยู่บนกระดาษ ครึ่งขวาอยู่บนก้านทอง — ฉีกก้านออกเมื่อไหร่เลขขาดครึ่ง มูลค่าอยู่ที่ใบเต็ม ไม่ใช่ชิ้นส่วน · ตัวหนังสือเล็กและเป๊ะ ที่ว่างเยอะ' },
  { key: 'ข', id: 'arcdisc', name: 'จานทอง', art: 'balcony',
    blurb: 'รูปทรงนำ · โปสเตอร์',
    sig: 'ลายเซ็น: <b>วงกลมทองวงเดียว</b> เป็นบ้านของตัวเลข ยื่นล้ำออกนอกขอบใบ — ทั้งใบเป็นมุมฉากหมด มีของโค้งชิ้นเดียว ตาจึงไปหยุดตรงนั้นทันที · ภาพเป็นบล็อกดูโอโทนดำ' },
  { key: 'ค', id: 'slantset', name: 'เอียง', art: 'gate',
    blurb: 'ตัวหนังสือนำ · ขาวล้วน',
    sig: 'ลายเซ็น: <b>ชื่อคูปองเอียง 12°</b> พาดขวางใบที่ตรงเป๊ะทั้งใบ — เอียงชิ้นเดียวเท่านั้น ทั้งใบจึงยังอ่านง่าย · ทองใช้เป็นแท่งขีดใต้ตัวเลขที่เดียว' },
];

let sample = 'percent';

function paint() {
  const v = createVoucher(SAMPLES[sample]);
  document.querySelector('#wrap').innerHTML = DIRS.map((d) => `
    <section class="dir">
      <div class="dir__hd">
        <span class="dir__k">${d.key}</span>
        <span class="dir__name">${d.name}</span>
        <span class="dir__blurb">${d.blurb}</span>
      </div>
      <div class="stagebox">
        ${cardHtml(v, { design: d.id, shape: 'ticket', art: d.art })}
      </div>
      <p class="dir__sig">${d.sig}</p>
    </section>`).join('');
}

document.querySelector('#seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  sample = b.dataset.v;
  for (const x of document.querySelectorAll('#seg button')) x.setAttribute('aria-pressed', String(x === b));
  paint();
});

paint();
</script>
</body>
</html>
