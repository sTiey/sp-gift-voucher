<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตั๋ว · สีทองเหลือง</title>
<link rel="stylesheet" href="../src/styles/fonts.css">
<link rel="stylesheet" href="../src/tokens/tokens.css">
<link rel="stylesheet" href="../src/tokens/skin-steel.css">
<link rel="stylesheet" href="../src/styles/base.css">
<link rel="stylesheet" href="../src/styles/card-base.css">
<link rel="stylesheet" href="../src/styles/designs/limeticket.css">
<style>
  :root { --pg: #83878e; --ink: #14161a; --ink-2: #43474e; }
  body {
    background: var(--pg); color: var(--ink);
    font-family: 'Google Sans', 'Noto Sans Thai', sans-serif;
  }

  .hd {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 13px 26px;
    background: rgb(18 20 24 / 94%); backdrop-filter: blur(10px); color: #f2f3f5;
  }
  .hd__t { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .hd__s { font-size: 12px; color: #a7abb3; }
  .sp { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: #2a2d33; border-radius: 6px; }
  .seg button {
    padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500;
    color: #a7abb3; background: none; border: 0; cursor: pointer;
  }
  .seg button[aria-pressed='true'] { background: #f2f3f5; color: #14161a; font-weight: 600; }

  .wrap { max-width: 1180px; margin-inline: auto; padding: 34px 24px 90px; }

  /* วางสองสีเรียงลงล่าง ไม่ใช่เคียงข้าง — ใบทรงยาวกว้าง 720px
     ถ้าบีบให้อยู่ 2 คอลัมน์ ใบจะถูกย่อจนเทียบสีกันไม่ตรงความจริง */
  .cols { display: grid; gap: 52px; grid-template-columns: minmax(0, 1fr); }
  .row2 { display: grid; gap: 26px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 1140px) { .row2 { grid-template-columns: 720px minmax(0, 1fr); } }

  .col { display: grid; gap: 16px; align-content: start; }
  .col__hd { display: flex; align-items: baseline; gap: 10px; }
  .col__name { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .col__note { font-size: 12px; color: var(--ink-2); }
  .dot { width: 13px; height: 13px; border: 1px solid rgb(20 22 26 / 35%); }
  .dot[data-c='lime'] { background: #c8f000; }
  .dot[data-c='gold'] { background: #c9a961; }

  .slot { display: grid; gap: 8px; }
  .slot__cap {
    font: 500 10px/1 'IBM Plex Mono', monospace;
    color: rgb(20 22 26 / 55%); letter-spacing: .09em; text-transform: uppercase;
  }
  /* ทรงยาวกว้างกว่าคอลัมน์ → ให้ย่อลงมาพอดีคอลัมน์ ไม่ล้นออกนอกจอ */
  .slot--ticket .vk-voucher { max-width: 100%; }
  .slot--compact .vk-voucher { max-width: 340px; }
</style>
</head>
<body>

<div class="hd">
  <span class="hd__t">ตั๋ว · ทองเหลือง</span>
  <span class="hd__s">สีที่ไท้เลือก · เขียวเก็บไว้ข้างล่างให้เทียบ</span>
  <span class="sp"></span>
  <span class="hd__s">ตัวอย่าง</span>
  <div class="seg" id="seg">
    <button type="button" data-v="percent" aria-pressed="true">ลด %</button>
    <button type="button" data-v="amount" aria-pressed="false">บัตรกำนัล</button>
    <button type="button" data-v="fixed" aria-pressed="false">ราคาพิเศษ</button>
    <button type="button" data-v="ship" aria-pressed="false">ส่งฟรี</button>
    <button type="button" data-v="used" aria-pressed="false">ใช้แล้ว</button>
  </div>
</div>

<div class="wrap">
  <div class="cols" id="cols"></div>
</div>

<script type="module">
import { cardHtml } from '../src/ui/voucher-design.js';
import { createVoucher } from '../src/index.js';

const SAMPLES = {
  percent: { code: 'SPE-7K4M-92XH', kind: 'percent', value: 15,
    title: 'ส่วนลดพาร์ทเนอร์ ไตรมาส 3', note: 'ขอบคุณที่ร่วมงานกับเรามาตลอด 3 ปี',
    conditions: { minSpend: 10000, maxDiscount: 2000 }, audience: { segments: ['partner'] },
    validUntil: '2026-12-31T23:59:59+07:00', design: { badge: 'PARTNER' } },
  amount: { code: 'VIP-3H8N-5TQA', kind: 'amount', value: 1500,
    title: 'บัตรกำนัลลูกค้าประจำ', conditions: { minSpend: 8000 },
    audience: { segments: ['vip'] }, validUntil: '2026-09-30T23:59:59+07:00' },
  fixed: { code: 'BACK-9RD2-6MWB', kind: 'fixed_price', value: 7900,
    title: 'ราคาพิเศษ · ราวระเบียง 1 ชุด', audience: { segments: ['returning'] },
    validUntil: '2026-10-31T23:59:59+07:00', design: { badge: '30 สิทธิ์' } },
  ship: { code: 'SHIP-4C7B-8XJR', kind: 'free_shipping', value: 0,
    title: 'ส่งฟรีทั่วประเทศ', conditions: { minSpend: 5000 }, validUntil: null },
  used: { code: 'SPE-6J2X-4NBY', kind: 'amount', value: 500,
    title: 'ส่วนลดต้อนรับลูกค้าใหม่', conditions: { minSpend: 3000 },
    state: 'redeemed', validUntil: '2026-12-31T23:59:59+07:00' },
};

const VARIANTS = [
  { accent: 'gold', key: 'gold', name: 'ทองเหลือง', note: 'สีที่เลือกใช้จริง — มาจากจุดตัดทองบนงานเหล็ก' },
  { accent: 'lime', key: 'lime', name: 'เขียวมะนาว', note: 'เก็บไว้เทียบ · เปลี่ยนได้ด้วยค่าเดียว' },
];

let sample = 'percent';

function paint() {
  const v = createVoucher(SAMPLES[sample]);
  document.querySelector('#cols').innerHTML = VARIANTS.map((x) => `
    <div class="col">
      <div class="col__hd">
        <span class="dot" data-c="${x.key}"></span>
        <span class="col__name">${x.name}</span>
        <span class="col__note">${x.note}</span>
      </div>
      <div class="row2">
        <div class="slot slot--ticket">
          ${cardHtml(v, { design: 'limeticket', shape: 'ticket', accent: x.accent, art: 'balcony' })}
          <span class="slot__cap">ทรงยาว — ส่ง LINE / อีเมล / จอคอม</span>
        </div>
        <div class="slot slot--compact">
          ${cardHtml(v, { design: 'limeticket', shape: 'compact', accent: x.accent, art: 'balcony' })}
          <span class="slot__cap">ทรงกระทัดรัด — บนมือถือ</span>
        </div>
      </div>
    </div>`).join('');
}

document.querySelector('#seg').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  sample = b.dataset.v;
  for (const x of document.querySelectorAll('#seg button')) {
    x.setAttribute('aria-pressed', String(x === b));
  }
  paint();
});

paint();
</script>
</body>
</html>
